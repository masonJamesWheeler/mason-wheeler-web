[workspace]
resolver = "2"
members = ["app", "server", "shared"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"

# Leptos workspace config for cargo-leptos
[[workspace.metadata.leptos]]
name = "mason-wheeler-web"
bin-package = "mason-wheeler-app"
lib-package = "mason-wheeler-app"
output-name = "mason-wheeler-web"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "app/style/app.css"
tailwind-config-file = "app/tailwind.config.js"
assets-dir = "app/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
